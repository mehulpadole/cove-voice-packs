name: Publish MoCHi APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-mochi-apk.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from public release
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://github.com/mehulpadole/mochi-aura-modal/releases/download/mochi-android-preview-2026-10-23/MoCHi.apk" -o MoCHi.apk
          test "$(stat -c%s MoCHi.apk)" -eq 101933326
          echo "35ef051403c9c97ac1735c357018d093c3cf97ab4459ec55202456c0bed7e884  MoCHi.apk" | sha256sum -c -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mochi-android-preview-2026-10-23
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" MoCHi.apk --repo "$GITHUB_REPOSITORY" --title "MoCHi Android Preview" --notes "MoCHi Android preview updated 28 October 2026. Download MoCHi.apk below. SHA-256: 35ef051403c9c97ac1735c357018d093c3cf97ab4459ec55202456c0bed7e884"
